
<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="image/jpg" href="../../assetts/KPIcon.png">
        <title>Scoundrel HTML</title>
        <style>
            body { 
                background: #111;
                color: #ffffff;
                font-family: Georgia, 'Times New Roman', Times, serif;
                margin: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
            }

            #gameCanvas {
                border: 5px solid #444;
                background: #222;
                margin-top: 20px;
            }

            #hud{
                width: 720px;
                text-align: center;      
                margin-top: 15px;
                font-size: 20px;
                white-space: nowrap;
            }

            #hud span {
                margin: 0 20px;
            }

            #labelLayer {
                position: absolute;
                left: 0;
                top: 0;
                pointer-events: none;
            }

            .cardLabel {
                position: absolute;
                color: rgb(173, 0, 0);
                font-size: 14px;
                font-weight: bold;
            }
            .overlayScreen {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0,0,0,0.85);
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                color: white;
                font-family: Georgia, serif;
                font-size: 32px;
                z-index: 10;
            }

            .overlayScreen button {
                margin-top: 20px;
                padding: 10px 30px;
                font-size: 20px;
                cursor: pointer;
                border-radius: 6px;
                border: none;
                background: #c33;
                color: white;
            }
            #runButton {
                position: absolute;
                left: 50%;
                transform: translateX(-50%);
                top: 40%;
                left: 35.8%;
                cursor: pointer;
                opacity: 0.85;
                transition: 0.2s;
            }

            #runButton:hover {
                opacity: 1;
                transform: translateX(-50%) scale(1.1);
            }


            #gameOverScreen {
                display: none; 
            }

            #startScreen {
                display: flex; 
            }

        </style>
    </head>
    <body>
        <canvas id="gameCanvas" width="720" height="480"></canvas> 
        <div id="hud">
            Health: <span id="healthDisplay"></span>
            <!--Weapon: <span id="weaponDisplay">None</span>-->
            Deck: <span id="deckDisplay"></span>
            <!--Discard: <span id="discardDisplay"></span>-->
        </div>
        <img id="runButton" src="assets/run_icon.png" width="50" height="50">
        <div id="labelLayer"></div>
        <div id="startScreen" class="overlayScreen">
            <h1>Scoundrel</h1>
            <button id="startButton">Start Game</button>
        </div>

        <div id="gameOverScreen" class="overlayScreen">
            <h2 id="gameOverMessage">Game Over!</h2>
            <button id="restartButton">Play Again</button>
        </div>

        <script src="scoundrel.js"></script>
    </body>
</html>
